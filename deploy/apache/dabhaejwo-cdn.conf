# dabhaejwo-cdn.tagoplus.co.kr → 위젯 정적 파일 (/srv/dabhaejwo/widget)
#
# **컨테이너가 아니다.** 위젯은 남의 사이트가 <script src> 로 불러가는 파일 하나(w.js)라
# 서버를 띄울 이유가 없다. CI 가 빌드 이미지에서 산출물을 꺼내 이 디렉터리에 넣고,
# Apache 가 그대로 서빙한다.
#
# 사전 준비 (한 번만):
#   sudo mkdir -p /srv/dabhaejwo/widget
#   sudo chown -R gitlab-runner:gitlab-runner /srv/dabhaejwo/widget   # CI 가 여기에 쓴다
#   sudo mkdir -p /var/log/apache2/dabhaejwo
#
# 설치: /etc/apache2/sites-available/ 에 복사 후 a2ensite.
# 필요한 모듈: headers deflate (ssl)
#   sudo a2enmod headers deflate ssl
# TLS(:443)는 certbot --apache 가 이 vhost 를 보고 자동 생성한다.

<VirtualHost *:80>
    ServerName dabhaejwo-cdn.tagoplus.co.kr

    DocumentRoot /srv/dabhaejwo/widget

    <Directory /srv/dabhaejwo/widget>
        Require all granted
        # 디렉터리 목록을 내주지 않는다. 여기 있는 건 공개 파일뿐이지만,
        # 무엇이 있는지 나열해 줄 이유도 없다.
        Options -Indexes -ExecCGI
        AllowOverride None
    </Directory>

    # 9.5KB → 압축하면 유의미하게 줄고, 남의 사이트 로딩에 얹히는 비용이 그만큼 준다.
    AddOutputFilterByType DEFLATE application/javascript text/javascript

    # **charset 을 반드시 붙인다.** w.js 안에는 한글 문자열이 들어 있는데
    # (`답해줘로 만든 챗봇`, `궁금한 점을 입력하세요`), charset 이 없으면 브라우저가
    # <b>호스트 페이지의 인코딩</b>을 따라 해석한다. 업체 사이트가 EUC-KR 이거나 인코딩
    # 선언이 없으면 그 사이트에서만 한글이 깨진다 — 우리 쪽에서는 멀쩡히 보여 찾기 어렵다.
    AddCharset UTF-8 .js

    <FilesMatch "\.js$">
        # 캐시를 짧게 잡는다. w.js 는 **고정 URL** 이라(수천 개 고객 페이지에 박혀 있다)
        # 파일명으로 캐시를 무를 수 없다. 길게 잡으면 버그 수정이 그 시간만큼 늦게 퍼지고,
        # 너무 짧으면 매 페이지뷰마다 왕복한다. 5분은 그 사이의 타협이다.
        Header set Cache-Control "public, max-age=300, must-revalidate"

        # 스크립트 로드 자체에는 CORS 가 필요 없지만, 호스트 사이트가
        # crossorigin 속성을 붙이거나 SRI 를 쓰면 필요해진다. 공개 파일이라 열어도 무해하다.
        Header set Access-Control-Allow-Origin "*"
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"

    ErrorLog  ${APACHE_LOG_DIR}/dabhaejwo/cdn_error.log
    CustomLog ${APACHE_LOG_DIR}/dabhaejwo/cdn_access.log combined
</VirtualHost>
