# dabhaejwo-api.tagoplus.co.kr → api 컨테이너 (127.0.0.1:4310)
#
# 설치: /etc/apache2/sites-available/ 에 복사 후 a2ensite.
# 필요한 모듈: proxy proxy_http proxy_wstunnel rewrite headers ssl
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl
# TLS(:443)는 certbot --apache 가 이 vhost 를 보고 자동 생성한다.

<VirtualHost *:80>
    ServerName dabhaejwo-api.tagoplus.co.kr

    ProxyPreserveHost On
    ProxyRequests Off

    # ── WebSocket (/ws/notifications) ────────────────────────────────
    # 알림 소켓. **이 블록이 catch-all ProxyPass 보다 위에 있어야 한다** —
    # 아래에 두면 업그레이드 요청이 평범한 HTTP 로 프록시되어 핸드셰이크가 400 으로 끝난다.
    #
    # 경로를 /ws/ 로 좁힌 이유: 업그레이드 헤더만 보고 전부 넘기면, 나중에 다른 경로에
    # Upgrade 를 쓰는 것이 생겼을 때 어디로 갈지 이 파일만 보고는 알 수 없다.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(ws/.*)$ "ws://127.0.0.1:4310/$1" [P,L]

    # 소켓은 알림이 없으면 조용하다. 기본 타임아웃으로는 유휴 연결이 끊기고
    # 클라이언트가 재접속을 반복한다(백오프가 있어 치명적이진 않지만 로그가 지저분해진다).
    ProxyPass /ws/ ws://127.0.0.1:4310/ws/ connectiontimeout=5 timeout=3600
    ProxyPassReverse /ws/ ws://127.0.0.1:4310/ws/

    # ── 나머지 HTTP ─────────────────────────────────────────────────
    # 답변 생성은 공급사 왕복이 있어 느리다(읽기 타임아웃 30초). 프록시 타임아웃이
    # 그보다 짧으면 Apache 가 먼저 끊어 502 를 내고, 모델 원가는 이미 나간 뒤다.
    ProxyPass        / http://127.0.0.1:4310/ timeout=120
    ProxyPassReverse / http://127.0.0.1:4310/

    # 문서 업로드 20MB + 멀티파트 여유. 서버(application.yml)와 같은 값이어야 한다 —
    # 여기가 더 작으면 우리 오류 메시지에 닿기도 전에 Apache 가 413 으로 끊는다.
    LimitRequestBody 23068672

    # ── 방문자 IP 위조 차단 ─────────────────────────────────────────
    # 들어온 X-Forwarded-For 를 **버리고** 새로 쓰게 한다.
    #
    # mod_proxy 는 기존 헤더에 실제 IP 를 덧붙일 뿐 지우지 않는다. 지우지 않으면
    # 클라이언트가 보낸 위조 IP 가 목록 앞쪽에 남고, 앱이 그걸 고르면(과거 구현이 그랬다)
    # 헤더만 바꿔가며 가입 제한·질문 제한을 무한히 우회할 수 있다.
    #
    # 앱도 마지막 항목을 읽도록 고쳐 뒀다(ClientIp) — 한쪽이 틀려도 뚫리지 않게
    # 양쪽에서 막는다. 이 줄을 지우면 방어가 한 겹 남는다.
    RequestHeader unset X-Forwarded-For

    # 로그 디렉터리 선행 생성 필요: mkdir -p /var/log/apache2/dabhaejwo
    ErrorLog  ${APACHE_LOG_DIR}/dabhaejwo/api_error.log
    CustomLog ${APACHE_LOG_DIR}/dabhaejwo/api_access.log combined
</VirtualHost>
