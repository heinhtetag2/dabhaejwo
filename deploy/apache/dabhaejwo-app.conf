# dabhaejwo.tagoplus.co.kr → tenant(랜딩 + 업체 대시보드) 컨테이너 (127.0.0.1:4312)
#
# 이 도메인이 서비스의 얼굴이다 — `/` 는 랜딩·요금제·가입이고 `/app` 아래가 대시보드다.
# 하나의 Next 앱이라 vhost 도 하나다.
#
# 설치: /etc/apache2/sites-available/ 에 복사 후 a2ensite.
# 필요한 모듈: proxy proxy_http headers (rewrite ssl)
# TLS(:443)는 certbot --apache 가 이 vhost 를 보고 자동 생성한다.

<VirtualHost *:80>
    ServerName dabhaejwo.tagoplus.co.kr

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        / http://127.0.0.1:4312/
    ProxyPassReverse / http://127.0.0.1:4312/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # 프레임 차단은 걸지 않는다 — 랜딩이 외부에 임베드될 여지를 남긴다.
    # 대시보드만 막고 싶어지면 <Location /app> 으로 좁힌다.

    # 로그 디렉터리 선행 생성 필요: mkdir -p /var/log/apache2/dabhaejwo
    ErrorLog  ${APACHE_LOG_DIR}/dabhaejwo/app_error.log
    CustomLog ${APACHE_LOG_DIR}/dabhaejwo/app_access.log combined
</VirtualHost>
