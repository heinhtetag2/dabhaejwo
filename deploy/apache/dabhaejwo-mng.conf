# dabhaejwo-mng.tagoplus.co.kr → admin(운영 콘솔) 컨테이너 (127.0.0.1:4311)
#
# 설치: /etc/apache2/sites-available/ 에 복사 후 a2ensite.
# 필요한 모듈: proxy proxy_http headers (rewrite ssl)
# TLS(:443)는 certbot --apache 가 이 vhost 를 보고 자동 생성한다.

<VirtualHost *:80>
    ServerName dabhaejwo-mng.tagoplus.co.kr

    ProxyPreserveHost On
    ProxyRequests Off

    # ── 접근 제한 ───────────────────────────────────────────────────
    # 운영 콘솔은 전 업체의 데이터를 본다. 기획서 §8 은 사내 IP 또는 VPN 뒤에서만
    # 접근하도록 정했는데, **애플리케이션에는 그 강제가 아직 없다**
    # (`dabhaejwo.ops.ip-allowlist` 값을 읽는 코드가 없다 — IMPROVEMENTS 등록됨).
    # 그때까지는 여기가 유일한 방어선이다. 주석을 풀고 실제 대역을 넣는다.
    #
    # <Location />
    #     Require ip 203.0.113.0/24
    #     Require ip 198.51.100.7
    # </Location>

    ProxyPass        / http://127.0.0.1:4311/
    ProxyPassReverse / http://127.0.0.1:4311/

    # 내부 도구다. 검색엔진에 뜨거나 남의 페이지에 프레임으로 박힐 이유가 없다.
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    # 로그 디렉터리 선행 생성 필요: mkdir -p /var/log/apache2/dabhaejwo
    ErrorLog  ${APACHE_LOG_DIR}/dabhaejwo/mng_error.log
    CustomLog ${APACHE_LOG_DIR}/dabhaejwo/mng_access.log combined
</VirtualHost>
