# 공통 설정. 프로파일과 무관하게 항상 적용된다.
#
#   application.yml             ← 이 파일. 공통값과 되돌리기 어려운 정책값
#   application-local.yml       ← 개발. 기본값이 넉넉하고 stub 공급사를 쓴다
#   application-production.yml  ← 운영. 기본값을 주지 않아 환경변수가 빠지면 기동에 실패한다
#
# 프로파일을 지정하지 않으면 local 로 뜬다. 운영은 SPRING_PROFILES_ACTIVE=production.
#
# **비밀은 어느 yml 에도 적지 않는다.** 전부 환경변수로 받는다.
# 로컬은 저장소 루트의 .env 를 DotenvEnvironmentPostProcessor 가 읽어 넣어준다.

spring:
  application:
    name: dabhaejwo-api

  profiles:
    default: local

  jpa:
    # 스키마의 진실은 Flyway 다. Hibernate 는 검증만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # 시각은 timestamptz 로 저장하지만, 드라이버가 JVM 기본 타임존으로
          # 해석하지 않도록 UTC 를 고정한다.
          time_zone: UTC

  servlet:
    multipart:
      # 서비스의 파일당 상한(dabhaejwo.storage.max-file-size-mb)과 같은 값이어야 한다.
      # 여기가 더 작으면 서비스 검증에 닿기도 전에 톰캣이 잘라 우리 메시지가 안 나간다.
      max-file-size: 20MB
      # 멀티파트 전체. 파일 하나 + 필드 몇 개라 파일 상한보다 조금만 크면 된다.
      max-request-size: 22MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 이미 테이블이 있는 스키마에 함부로 베이스라인을 잡지 않는다.
    baseline-on-migrate: false

server:
  error:
    include-message: never
    include-stacktrace: never   # 에러 응답에 내부 구조 노출 금지 (security-rules)

management:
  endpoints:
    web:
      exposure:
        include: health,info

dabhaejwo:
  auth:
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    # 대리 로그인 세션 만료. tenant-plan.md FR-05 — 프로파일별로 다르게 두지 않는다.
    # 운영에서만 늘리는 식이면 개발에서 만료 동작을 검증할 수 없다.
    impersonation-ttl-minutes: 30
