spring:
  application:
    name: dabhaejwo-api

  datasource:
    # MariaDB 에는 timestamptz 가 없다. 커넥션 타임존을 UTC 로 고정해
    # DATETIME 컬럼이 항상 UTC 로만 오가게 한다 — 이게 깨지면 시각이 조용히 밀린다.
    url: jdbc:mariadb://${MARIADB_HOST:localhost}:${MARIADB_PORT:3306}/${MARIADB_DB:dabhaejwo}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MARIADB_USER:dabhaejwo}
    password: ${MARIADB_PASSWORD:}

  jpa:
    # 스키마의 진실은 Flyway 다. Hibernate 는 검증만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never   # 에러 응답에 내부 구조 노출 금지 (security-rules)

management:
  endpoints:
    web:
      exposure:
        include: health,info

dabhaejwo:
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    # 대리 로그인 세션 만료. tenant-plan.md FR-05 — 값은 여기서만 바꾼다.
    impersonation-ttl-minutes: 30
  ops:
    # 운영 콘솔 접근 IP allowlist. 비우면 제한 없음(로컬 개발).
    ip-allowlist: ${OPS_IP_ALLOWLIST:}
  llm:
    # 활성 공급사. 자격증명이 없는 공급사는 자동으로 비활성화된다.
    # 모델명·단가는 여기가 아니라 model_prices 테이블에 있다.
    default-provider: ${LLM_DEFAULT_PROVIDER:STUB}
    google:
      api-key: ${GEMINI_API_KEY:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    openai:
      api-key: ${OPENAI_API_KEY:}
  storage:
    # TODO(stub): S3 호환 저장소 미연동. 로컬 디스크로 대체.
    local-path: ${FILE_STORAGE_PATH:./var/uploads}
  notification:
    # TODO(stub): 슬랙 미연동. 로그만 남긴다.
    slack-webhook-url: ${SLACK_OPS_WEBHOOK_URL:}

logging:
  level:
    com.dabhaejwo: INFO
