# 운영 프로파일. SPRING_PROFILES_ACTIVE=production 으로 활성화한다.
#
# **기본값을 주지 않는다.** 환경변수가 빠지면 기동에 실패한다.
# 운영에서 조용히 localhost 나 빈 비밀번호로 뜨는 것보다 못 뜨는 편이 낫다 —
# 전자는 몇 시간 뒤에 이상한 증상으로 발견되고, 후자는 배포 즉시 발견된다.
#
# 비밀은 이 파일에 적지 않는다. 배포 환경의 시크릿 관리로 주입한다.

server:
  port: ${SERVER_PORT:4310}

spring:
  datasource:
    url: jdbc:mariadb://${MARIADB_HOST}:${MARIADB_PORT}/${MARIADB_DB}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MARIADB_USER}
    password: ${MARIADB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

dabhaejwo:
  auth:
    # 없으면 기동 실패. 임시 키로 뜨면 재시작마다 전 사용자가 로그아웃된다.
    jwt-secret: ${JWT_SECRET}
  ops:
    # 운영 콘솔은 사내 IP 또는 VPN 뒤에서만 접근한다 (admin-console-plan.md §8).
    # 비워두면 제한이 사라지므로 운영에서는 반드시 값을 넣는다.
    ip-allowlist: ${OPS_IP_ALLOWLIST}
  llm:
    default-provider: ${LLM_DEFAULT_PROVIDER}
    google:
      api-key: ${GEMINI_API_KEY:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    openai:
      api-key: ${OPENAI_API_KEY:}
  storage:
    # TODO(stub): S3 호환 저장소 미연동. 운영 전에 교체할 것.
    local-path: ${FILE_STORAGE_PATH:/var/lib/dabhaejwo/uploads}
  notification:
    # TODO(stub): 슬랙 미연동. 상한 도달 알림이 안 나간다.
    slack-webhook-url: ${SLACK_OPS_WEBHOOK_URL:}

logging:
  level:
    root: WARN
    "[com.dabhaejwo]": INFO
