# 개발 프로파일. 기본값을 넉넉히 두어 환경변수 없이도 뜬다.
#
# 비밀번호·API 키는 여기 적지 않는다. 저장소 루트의 .env 에 넣으면
# DotenvEnvironmentPostProcessor 가 프로퍼티로 얹어준다.
# 굳이 파일로 두어야 하면 application-secret.yml 을 만든다 — gitignore 대상이다.

server:
  port: ${SERVER_PORT:4310}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dabhaejwo}
    username: ${POSTGRES_USER:dabhaejwo}
    password: ${POSTGRES_PASSWORD:}

dabhaejwo:
  storage:
    # 비어 있으면 업로드가 FEATURE_NOT_READY 로 거절된다. 로컬 디스크로 대체하지 않는다.
    bucket: ${R2_BUCKET:}
    endpoint: ${R2_ENDPOINT:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    max-file-size-mb: 20
  cors:
    # 브라우저에서 API 를 부르는 출처. admin 4311 / tenant 4312 / widget 데모 5173.
    # 여기 없는 출처는 브라우저 요청이 막힌다 (curl 은 영향 없음).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4311,http://localhost:4312,http://localhost:5173}
  auth:
    # 비워두면 기동할 때마다 임시 키가 생성되고 이전 토큰이 전부 무효가 된다.
    # 개발 중 로그인이 자꾸 풀리면 .env 에 JWT_SECRET 을 채운다.
    jwt-secret: ${JWT_SECRET:}
  ops:
    # 로컬에서는 IP 제한을 걸지 않는다.
    ip-allowlist: ${OPS_IP_ALLOWLIST:}
  llm:
    # 기본은 stub. 실제 공급사를 붙이려면 .env 에 키를 넣고 이 값을 GOOGLE 등으로 바꾼다.
    # stub 도 ai_usage 적재는 실제로 하므로 원가 파이프라인은 그대로 검증된다.
    default-provider: ${LLM_DEFAULT_PROVIDER:STUB}
    google:
      api-key: ${GEMINI_API_KEY:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    openai:
      api-key: ${OPENAI_API_KEY:}
  notification:
    # TODO(stub): 슬랙 미연동. 로그만 남긴다.
    slack-webhook-url: ${SLACK_OPS_WEBHOOK_URL:}

logging:
  level:
    # 점이 들어간 맵 키는 [] 로 감싼다 — Spring 의 relaxed binding 규약이다
    "[com.dabhaejwo]": DEBUG
    "[org.flywaydb]": INFO
    # 스키마가 안 맞을 때 원인을 보려면 이게 필요하다
    "[org.hibernate.tool.schema]": INFO
