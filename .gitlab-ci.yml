# 답해줘 CI/CD — 단일 서버 러너로 검증 + 빌드 + 배포 (레지스트리 불필요)
#
# 러너: 운영 서버에 등록한 shell executor, 태그 'dabhaejwo-prod'.
#   - gitlab-runner 유저가 docker 를 쓸 수 있어야 함:
#     sudo usermod -aG docker gitlab-runner && sudo systemctl restart gitlab-runner
#   - 위젯 산출물을 놓을 곳에 쓰기 권한이 있어야 함:
#     sudo mkdir -p /srv/dabhaejwo/widget
#     sudo chown -R gitlab-runner:gitlab-runner /srv/dabhaejwo/widget
#
# 서버에는 Docker 만 있으면 된다 — Java·Node·Gradle 을 깔지 않는다.
# 네 프로젝트 모두 컨테이너 안에서 빌드되므로 서버 상태가 재현 가능하다.
#
# ── 필요한 CI/CD Variables (Settings > CI/CD > Variables) ────────────
# Masked + Protected 권장. **하나라도 빠지면 api 가 기동에 실패한다** — 운영 프로파일이
# 기본값을 주지 않기 때문이다. 조용히 localhost 로 뜨는 것보다 못 뜨는 편이 낫다.
#
#   POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   JWT_SECRET              — 바뀌면 전 사용자가 로그아웃된다. 한 번 정하고 고정
#   ENCRYPTION_KEY          — 공급사 API 키 암호화 마스터 키(AES-256-GCM).
#                             **바꾸면 등록된 키를 복호화할 수 없어 전부 다시 등록해야 한다**
#   R2_BUCKET, R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   CORS_ALLOWED_ORIGINS    — admin·tenant 도메인. 위젯은 여기 넣지 않는다
#                             (출처를 미리 알 수 없어 /api/widget/** 은 별도로 열려 있다)
#   OPS_IP_ALLOWLIST        — 운영 콘솔 접근 대역. 값을 요구하지만 **아직 코드가 읽지 않는다**
#                             (IMPROVEMENTS 등록). 실효 차단은 Apache vhost 가 한다
#   LLM_DEFAULT_PROVIDER    — GOOGLE. 실제 키는 운영 콘솔에서 암호화 등록한다(.env 아님)
#   MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM, MAIL_FROM_NAME
#   APP_BASE_URL, OPS_BASE_URL  — 초대·비밀번호 재설정 메일에 들어갈 절대 주소
#   OPS_SEED_EMAIL          — 운영자 시드 주소. 로그인 2단계 코드가 여기로 온다
#   NEXT_PUBLIC_API_BASE_URL— admin·tenant 클라 번들에 인라인. 예 https://dabhaejwo-api.tagoplus.co.kr
#   NEXT_PUBLIC_WIDGET_SRC  — 설치 화면이 보여줄 스크립트 주소. 예 https://dabhaejwo-cdn.tagoplus.co.kr/w.js
#   WIDGET_API_BASE_URL     — 위젯 번들에 박히는 API 주소. 보통 NEXT_PUBLIC_API_BASE_URL 과 같다
#   NEXT_PUBLIC_TOSS_CLIENT_KEY — 결제창 키(test_ck_*/live_ck_*). 없으면 카드 등록 버튼이 안 뜬다.
#                             시크릿 키(TOSS_SECRET_KEY)와 **짝으로** 교체할 것 — 한쪽만 라이브면 결제가 실패한다
#   WIDGET_DEPLOY_DIR       — 선택. 기본 /srv/dabhaejwo/widget
#
# 전체 환경변수 목록: docs/deploy/README.md

stages:
  - verify
  - deploy

# ── 검증 ────────────────────────────────────────────────────────────
# **이미지 빌드는 테스트를 돌리지 않는다.** 배포마다 몇 분씩 더 드는 것을 피하려는 선택이라,
# 그 방어를 여기서 대신한다. 검증이 깨지면 배포 잡이 아예 시작되지 않는다.
#
# 러너에 Java·Node 를 깔지 않기 위해 검증도 컨테이너 안에서 돌린다.
# 컨테이너를 러너와 같은 uid 로 돌린다. root 로 돌리면 검사가 만든 node_modules·빌드
# 산출물이 root 소유로 남아, 다음 파이프라인의 체크아웃이 "Permission denied" 로 깨진다.
# HOME 을 옮기는 것은 같은 이유다 — npm·gradle 이 캐시를 쓸 홈이 필요하다.
#
# 캐시는 named volume 에 둔다. 없으면 매 배포마다 의존성을 처음부터 받는다.
.in_container: &in_container |
  run_in() {
    image="$1"; dir="$2"; shift 2
    docker run --rm \
      --user "$(id -u):$(id -g)" \
      -e HOME=/tmp \
      -v "$PWD/$dir:/app" \
      -v "dabhaejwo-cache-$dir:/tmp" \
      -w /app "$image" sh -c "$*"
  }

verify:api:
  stage: verify
  tags:
    - dabhaejwo-prod
  script:
    - *in_container
    - run_in eclipse-temurin:21-jdk api "chmod +x gradlew && ./gradlew --no-daemon build"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

verify:web:
  stage: verify
  tags:
    - dabhaejwo-prod
  script:
    - *in_container
    # admin·tenant 는 lint·typecheck 까지. build 는 이미지 빌드가 어차피 한 번 더 한다.
    - run_in node:22-alpine admin  "npm ci && npm run lint && npm run typecheck"
    - run_in node:22-alpine tenant "npm ci && npm run lint && npm run typecheck"
    # 위젯은 사이즈 예산이 있어 build·size 까지 본다 — 초과하면 여기서 멈춘다.
    - run_in node:22-alpine widget "npm ci && npm run typecheck && npm test && npm run build && npm run size"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ── 배포 ────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  tags:
    - dabhaejwo-prod
  script:
    # ── 사전 점검 ───────────────────────────────────────────────────
    # **빠진 변수를 한 번에 전부 알려준다.** 이게 없으면 compose 가 처음 만난 하나만
    # 짚고 멈추고, api 런타임 변수는 아예 검사되지 않아 컨테이너가 뜬 뒤에야 실패한다.
    # 변수 하나 넣고 파이프라인 다시 돌리기를 반복하게 되므로, 여기서 다 모아 보여준다.
    - |
      missing=""
      # 없으면 컨테이너 빌드·기동이 실패하는 것들
      for v in POSTGRES_HOST POSTGRES_PORT POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
               JWT_SECRET CORS_ALLOWED_ORIGINS OPS_IP_ALLOWLIST LLM_DEFAULT_PROVIDER \
               R2_BUCKET R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
               NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_WIDGET_SRC; do
        eval "value=\${$v:-}"
        [ -n "$value" ] || missing="$missing $v"
      done

      # 기동은 되지만 서비스가 무의미해지는 것들. 막지는 않되 조용히 넘어가지도 않는다.
      warn=""
      for v in ENCRYPTION_KEY MAIL_HOST MAIL_USERNAME MAIL_PASSWORD MAIL_FROM \
               APP_BASE_URL OPS_BASE_URL; do
        eval "value=\${$v:-}"
        [ -n "$value" ] || warn="$warn $v"
      done

      if [ -n "$warn" ]; then
        echo "════════════════════════════════════════════════════════════"
        echo "경고 — 다음 변수가 비어 있습니다:$warn"
        echo "  MAIL_* 가 없으면 로그인 2단계 코드를 보낼 수 없어 **아무도 로그인하지 못합니다.**"
        echo "  ENCRYPTION_KEY 가 없으면 콘솔에서 공급사 키를 등록할 수 없어 챗봇이 답하지 못합니다."
        echo "  배포는 계속합니다 — docs/deploy/ci-variables.md §2 참조."
        echo "════════════════════════════════════════════════════════════"
      fi

      if [ -n "$missing" ]; then
        echo "════════════════════════════════════════════════════════════"
        echo "배포 중단 — 다음 변수가 비어 있습니다:"
        for v in $missing; do echo "    $v"; done
        echo ""
        echo "Settings → CI/CD → Variables 에서 채운 뒤 다시 실행하세요."
        echo "각 변수의 의미와 예시는 docs/deploy/ci-variables.md 에 있습니다."
        echo "════════════════════════════════════════════════════════════"
        exit 1
      fi
      echo "사전 점검 통과 — 필수 변수 15개 확인"

    - cd deploy
    # GitLab Variables → .env 생성. 시크릿은 서버 디스크에만 있고 레포에는 없다.
    - |
      cat > .env <<EOF
      SPRING_PROFILES_ACTIVE=production
      POSTGRES_HOST=$POSTGRES_HOST
      POSTGRES_PORT=$POSTGRES_PORT
      POSTGRES_DB=$POSTGRES_DB
      POSTGRES_USER=$POSTGRES_USER
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      JWT_SECRET=$JWT_SECRET
      ENCRYPTION_KEY=$ENCRYPTION_KEY
      R2_BUCKET=$R2_BUCKET
      R2_ENDPOINT=$R2_ENDPOINT
      R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
      R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
      CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS
      OPS_IP_ALLOWLIST=$OPS_IP_ALLOWLIST
      LLM_DEFAULT_PROVIDER=$LLM_DEFAULT_PROVIDER
      MAIL_HOST=$MAIL_HOST
      MAIL_PORT=$MAIL_PORT
      MAIL_USERNAME=$MAIL_USERNAME
      MAIL_PASSWORD=$MAIL_PASSWORD
      MAIL_FROM=$MAIL_FROM
      MAIL_FROM_NAME=$MAIL_FROM_NAME
      APP_BASE_URL=$APP_BASE_URL
      OPS_BASE_URL=$OPS_BASE_URL
      OPS_SEED_EMAIL=$OPS_SEED_EMAIL
      NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL
      NEXT_PUBLIC_WIDGET_SRC=$NEXT_PUBLIC_WIDGET_SRC
      NEXT_PUBLIC_TOSS_CLIENT_KEY=$NEXT_PUBLIC_TOSS_CLIENT_KEY
      EOF
    # 서버에서 직접 빌드 후 기동. admin·tenant 의 NEXT_PUBLIC_* 은 .env → compose build-arg 로 주입.
    # --remove-orphans: 구성에서 빠진 서비스의 컨테이너를 정리한다.
    - docker compose up -d --build --remove-orphans

    # ── 위젯: 컨테이너가 아니라 파일 배포 ────────────────────────────
    # 이미지를 만들고 산출물만 꺼내 Apache 문서 루트에 놓는다.
    - cd ..
    - |
      docker build \
        --build-arg VITE_API_BASE_URL="${WIDGET_API_BASE_URL:-$NEXT_PUBLIC_API_BASE_URL}" \
        -t dabhaejwo-widget:latest ./widget
    - |
      TARGET="${WIDGET_DEPLOY_DIR:-/srv/dabhaejwo/widget}"
      cid=$(docker create dabhaejwo-widget:latest)
      # 임시 폴더에 먼저 꺼낸다. 문서 루트에 바로 쓰면 복사 도중의 반쪽짜리 파일이
      # 그대로 방문자에게 나간다 — 위젯이 깨진 채로 남의 사이트에서 돈다.
      staging=$(mktemp -d)
      docker cp "$cid:/dist/." "$staging/"
      docker rm "$cid"
      test -s "$staging/w.js" || (echo "w.js 가 비어 있습니다" && exit 1)
      # 두 단계인 이유 — 첫 mv 는 /tmp → /srv 라 파일시스템을 넘을 수 있어 원자적이지 않다.
      # 그래서 **같은 디렉터리 안의 임시 이름**으로 먼저 옮기고, 두 번째 mv(rename)로 갈아끼운다.
      # 이쪽은 같은 파일시스템이라 원자적이므로 교체 순간에 걸치는 요청이 없다.
      mv "$staging/w.js" "$TARGET/w.js.new" && mv "$TARGET/w.js.new" "$TARGET/w.js"
      rm -rf "$staging"
      echo "위젯 배포됨: $TARGET/w.js ($(stat -c%s "$TARGET/w.js") bytes)"

    - docker image prune -f
    # 빌드 캐시 상한 유지 — 방치하면 수십 GB 누적된다.
    - docker builder prune -f --keep-storage 3GB
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: production
    url: https://dabhaejwo.tagoplus.co.kr
